name: Detect clip black bars
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  crop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download clips
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download clips -p '*.mp4' -D clips
      - name: Detect
        run: python3 crop.py > crop.log 2>&1 || true
      - name: Commit
        run: |
          git config user.name viperr-sync
          git config user.email sync@users.noreply.github.com
          git add -f crop.log; [ -f clipcrop.json ] && git add -f clipcrop.json || true
          git diff --cached --quiet || git commit -m "Clip crop data"
          git pull --rebase --autostash origin main || true
          git push origin HEAD:main
