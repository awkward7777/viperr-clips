name: Sync releases

on:
  schedule:
    - cron: "17 */3 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "run | dry | baseline | probe"
        default: run

permissions:
  contents: write

concurrency: sync

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: pip install -U "yt-dlp[default]"
      - name: PO token server (replaces YouTube cookies when possible)
        run: |
          git clone -q --depth 1 https://github.com/Brainicism/bgutil-ytdlp-pot-provider.git /tmp/pot
          pip install -q bgutil-ytdlp-pot-provider
          cd /tmp/pot/server && npm ci --silent && npx tsc
          nohup node build/main.js > /tmp/pot.log 2>&1 &
          sleep 5
          curl -s localhost:4416/ping
          mkdir -p ~/.config/yt-dlp
          printf '%s\n' '--js-runtimes node' '--extractor-args youtubepot-bgutilhttp:base_url=http://127.0.0.1:4416' > ~/.config/yt-dlp/config
      - name: YouTube cookies (optional)
        env:
          YT_COOKIES: ${{ secrets.YT_COOKIES }}
        run: if [ -n "$YT_COOKIES" ]; then printf '%s' "$YT_COOKIES" > cookies.txt; fi
      - name: Probe (can this runner download from YouTube?)
        if: ${{ github.event.inputs.mode == 'probe' }}
        run: |
          : > probe.txt
          for c in default mweb web_safari; do
            echo "== client $c" >> probe.txt
            if [ "$c" = default ]; then A=""; else A="--extractor-args youtube:player_client=$c"; fi
            if yt-dlp $A -f "140/bestaudio" -o /tmp/probe.%(ext)s "https://www.youtube.com/watch?v=q4pVTvUOWJA" >> probe.txt 2>&1; then echo "RESULT OK $c" >> probe.txt; ls -la /tmp/probe.* >> probe.txt; break; else echo "RESULT FAIL $c" >> probe.txt; fi
          done
          tail -c 3000 /tmp/bgutil.log >> probe.txt 2>/dev/null || true
          git config user.name viperr-sync; git config user.email sync@users.noreply.github.com
          git add probe.txt; git commit -m "probe result" && git pull --rebase && git push
      - name: Sync
        if: ${{ github.event.inputs.mode != 'probe' }}
        env:
          GH_TOKEN: ${{ github.token }}
          MODE: ${{ github.event.inputs.mode }}
        run: |
          case "$MODE" in
            baseline) python sync.py --baseline ;;
            dry) python sync.py --dry ;;
            *) python sync.py ;;
          esac
      - name: Artist photos (Spotify)
        if: ${{ github.event.inputs.mode != 'probe' }}
        env:
          SPOTIFY_ID: ${{ secrets.SPOTIFY_ID }}
          SPOTIFY_SECRET: ${{ secrets.SPOTIFY_SECRET }}
        run: python artists.py
      - name: Commit catalog
        if: ${{ github.event.inputs.mode != 'probe' }}
        run: |
          git config user.name "viperr-sync"
          git config user.email "sync@users.noreply.github.com"
          git add new.json seen.json artists.json 2>/dev/null || git add new.json seen.json
          git diff --cached --quiet || (git commit -m "Catalog update" && git pull --rebase && git push)
