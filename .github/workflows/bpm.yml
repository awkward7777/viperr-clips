name: BPM

on:
  workflow_dispatch:
    inputs:
      max_min:
        description: "Time budget in minutes"
        default: "300"
  schedule:
    - cron: "10 4 * * 1"

permissions:
  contents: write

concurrency: bpm

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 345
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - run: pip install -q librosa numpy
      - name: Analyse
        env:
          MAX_MIN: ${{ github.event.inputs.max_min || '300' }}
        run: python3 bpm.py
      - name: Commit
        if: always()
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add bpm.json
          git diff --cached --quiet || (git commit -m "Update bpm.json" && git pull --rebase -q && git push -q)
