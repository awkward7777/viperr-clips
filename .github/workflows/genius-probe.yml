name: genius-probe
on: workflow_dispatch
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 genius_probe.py | tee genius_probe.txt
        env: { GENIUS_TOKEN: "${{ secrets.GENIUS_TOKEN }}" }
      - run: |
          git config user.name "genius-bot"; git config user.email "bot@users.noreply.github.com"
          git add genius_probe.txt genius_probe.json && git commit -m "genius probe" && git push || true
