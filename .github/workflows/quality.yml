name: Quality variants

on:
  schedule:
    - cron: "40 */6 * * *"
  workflow_dispatch:
    inputs:
      max_min:
        description: "Time budget in minutes"
        default: "300"

permissions:
  contents: write

concurrency: quality

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 345
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Transcode and index
        env:
          GH_TOKEN: ${{ github.token }}
          MAX_MIN: ${{ github.event.inputs.max_min || '300' }}
        run: python3 quality.py
      - name: Commit index
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add quality.json
          git diff --cached --quiet || (git commit -m "Update quality.json" && git pull --rebase -q && git push -q)
