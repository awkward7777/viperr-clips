name: Compat server

on:
  workflow_dispatch:
  push:
    paths: ["server/**", ".github/workflows/compat-deploy.yml"]

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Tests
        working-directory: server
        run: node --test test/community.test.mjs
      - name: Cloudflare setup
        run: |
          set -e
          [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ] || { echo "Нет секретов CF_API_TOKEN / CF_ACCOUNT_ID"; exit 1; }
          API=https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID
          H="Authorization: Bearer $CLOUDFLARE_API_TOKEN"
          SUB=$(curl -s -H "$H" $API/workers/subdomain | jq -r '.result.subdomain // empty')
          if [ -z "$SUB" ]; then
            for n in viperr-music viperr-music-$RANDOM; do
              curl -s -X PUT -H "$H" -H "content-type: application/json" -d "{\"subdomain\":\"$n\"}" $API/workers/subdomain >/dev/null
              SUB=$(curl -s -H "$H" $API/workers/subdomain | jq -r '.result.subdomain // empty')
              [ -n "$SUB" ] && break
            done
          fi
          [ -n "$SUB" ] || { echo "Не удалось получить поддомен workers.dev"; exit 1; }
          echo "SUB=$SUB" >> $GITHUB_ENV
          ID=$(curl -s -H "$H" "$API/storage/kv/namespaces?per_page=100" | jq -r '.result[]? | select(.title=="viperr-compat") | .id' | head -1)
          if [ -z "$ID" ]; then
            ID=$(curl -s -X POST -H "$H" -H "content-type: application/json" -d '{"title":"viperr-compat"}' $API/storage/kv/namespaces | jq -r '.result.id // empty')
          fi
          [ -n "$ID" ] || { echo "Не удалось создать KV"; exit 1; }
          sed -i "s/__KV_ID__/$ID/" server/wrangler.toml
      - name: Community database
        run: |
          # Сообщество (аккаунты и предложения) живёт в D1. Если у токена нет доступа к D1, сервер совместимости работает как раньше.
          API=https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID
          H="Authorization: Bearer $CLOUDFLARE_API_TOKEN"
          LIST=$(curl -s -H "$H" "$API/d1/database?name=viperr-community&per_page=100")
          if [ "$(echo "$LIST" | jq -r '.success')" != "true" ]; then
            echo "::warning::Сообщество выключено: у токена Cloudflare нет доступа к D1. Добавьте Account → D1 → Edit и запустите деплой снова."
            exit 0
          fi
          DBID=$(echo "$LIST" | jq -r '.result[]? | select(.name=="viperr-community") | .uuid' | head -1)
          if [ -z "$DBID" ]; then
            DBID=$(curl -s -X POST -H "$H" -H "content-type: application/json" -d '{"name":"viperr-community"}' "$API/d1/database" | jq -r '.result.uuid // empty')
          fi
          [ -n "$DBID" ] || { echo "::warning::Не удалось создать базу D1, сообщество выключено."; exit 0; }
          sed 's/--.*$//' server/schema.sql | jq -Rsc 'split(";")[] | gsub("^\\s+|\\s+$";"") | select(length>0) | {sql: .}' > "$RUNNER_TEMP/schema.jsonl"
          BAD=0
          while IFS= read -r line; do
            R=$(curl -s -X POST -H "$H" -H "content-type: application/json" -d "$line" "$API/d1/database/$DBID/query")
            echo "$R" | jq -e '.success==true' >/dev/null || { BAD=1; echo "$R" | jq -c '.errors'; }
          done < "$RUNNER_TEMP/schema.jsonl"
          if [ "$BAD" = 1 ]; then
            echo "::warning::Схема базы не применилась, сообщество выключено."
            exit 0
          fi
          printf '\n[[d1_databases]]\nbinding = "DB"\ndatabase_name = "viperr-community"\ndatabase_id = "%s"\n' "$DBID" >> server/wrangler.toml
          echo "DB_OK=1" >> $GITHUB_ENV
          echo "База сообщества готова."
      - name: Deploy
        working-directory: server
        run: npx --yes wrangler@3 deploy
      - name: Telegram bot
        working-directory: server
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          ADMIN_TG_ID: ${{ secrets.ADMIN_TG_ID }}
        run: |
          if [ -z "$TG_BOT_TOKEN" ]; then
            echo "Бот не подключён. Создайте бота у @BotFather, добавьте токен секретом TG_BOT_TOKEN и запустите деплой снова."
            exit 0
          fi
          if [ "$DB_OK" != "1" ]; then
            echo "::warning::Бот пропущен: база D1 не подключена."
            exit 0
          fi
          U="https://viperr-compat.$SUB.workers.dev"
          printf %s "$TG_BOT_TOKEN" | npx --yes wrangler@3 secret put TG_BOT_TOKEN >/dev/null
          if [ -n "$ADMIN_TG_ID" ]; then
            printf %s "$ADMIN_TG_ID" | npx --yes wrangler@3 secret put ADMIN_TG_ID >/dev/null
          else
            echo "ADMIN_TG_ID не задан: отправьте боту /start, он ответит вашим Telegram ID. Добавьте его секретом ADMIN_TG_ID и запустите деплой снова."
          fi
          SEC=$(printf %s "viperr-tg:$TG_BOT_TOKEN" | sha256sum | cut -d' ' -f1)
          API="https://api.telegram.org/bot$TG_BOT_TOKEN"
          R=$(curl -s "$API/setWebhook" --data-urlencode "url=$U/tg" -d "secret_token=$SEC" -d 'allowed_updates=["message","callback_query"]' -d max_connections=4)
          echo "webhook: $(echo "$R" | jq -c '{ok,description,error_code}')"
          echo "$R" | jq -e '.ok==true' >/dev/null || { echo "::warning::Telegram не принял webhook. Проверьте токен бота."; exit 0; }
          curl -s "$API/setMyCommands" -H 'content-type: application/json' -d '{"commands":[{"command":"pending","description":"Suggestions waiting for review"},{"command":"stats","description":"Counters"},{"command":"help","description":"All commands"}]}' >/dev/null
          curl -s "$API/getWebhookInfo" | jq -c '.result | {url,pending_update_count,last_error_message}'
      - name: Publish address
        run: |
          echo "{\"url\":\"https://viperr-compat.$SUB.workers.dev\"}" > compat.json
          git config user.name "github-actions"; git config user.email "actions@github.com"
          git checkout -- server/wrangler.toml
          git add compat.json
          git diff --cached --quiet || (git commit -m "compat url" && git pull --rebase -q && git push -q)
      - name: Smoke test
        run: |
          U="https://viperr-compat.$SUB.workers.dev"
          sleep 8
          R=$(curl -s -X POST $U/c -H 'content-type: application/json' -d '{"t":["1:0","1:1","2:0","3:1","4:2"],"n":"test"}')
          echo "post: $R"
          C=$(echo "$R" | jq -r .code)
          G=$(curl -s $U/c/$C)
          echo "get: $G"
          echo "$G" | jq -e '.t|length==5' >/dev/null
          [ "$(curl -s -o /dev/null -w '%{http_code}' $U/c/ZZZZ)" = 404 ]
          O=$(curl -s $U/stories/overlay)
          echo "overlay: $(echo "$O" | head -c 160)"
          if echo "$O" | jq -e '.error=="off"' >/dev/null 2>&1; then
            echo "::warning::Сообщество выключено (нет базы D1). Остальные функции работают."
            exit 0
          fi
          echo "$O" | jq -e 'has("v")' >/dev/null
          N=smoke$RANDOM$RANDOM
          PW=$(openssl rand -hex 32)
          R=$(curl -s -X POST $U/a/register -H 'content-type: application/json' -d "{\"nick\":\"$N\",\"pw\":\"$PW\"}")
          T=$(echo "$R" | jq -r '.token // empty')
          [ -n "$T" ] || { echo "register: $(echo "$R" | jq -c 'del(.token,.recovery)')"; exit 1; }
          curl -s $U/a/me -H "authorization: Bearer $T" | jq -e ".nick==\"$N\"" >/dev/null
          curl -s -X POST $U/a/login -H 'content-type: application/json' -d "{\"nick\":\"$N\",\"pw\":\"$PW\"}" | jq -e '.token' >/dev/null
          curl -s -X POST $U/a/delete -H "authorization: Bearer $T" -H 'content-type: application/json' -d "{\"pw\":\"$PW\"}" | jq -e '.ok==true' >/dev/null
          echo "Сообщество: регистрация, вход и удаление работают."
