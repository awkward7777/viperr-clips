name: Lyrics report
on: workflow_dispatch
permissions:
  contents: write
jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 lyrics_report.py
      - run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add lyrics_report.json site_playlists.json
          git diff --cached --quiet || (git commit -m "Lyrics report" && git pull --rebase -q && git push -q)
