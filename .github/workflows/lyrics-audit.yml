name: Lyrics audit
on: workflow_dispatch
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 lyrics_audit.py
      - run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add lyrics_audit.json
          git diff --cached --quiet || (git commit -m "Lyrics audit" && git pull --rebase -q && git push -q)
